name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy clang-tools gcc valgrind universal-ctags pipx
          pipx install norminette
          pipx install c-formatter-42
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install llvm gcc universal-ctags pipx
          pipx install norminette
          pipx install c-formatter-42
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
